<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리뷰 이벤트 랜덤 추첨기</title>
<style>
  :root {
    --bg: #fff8f1;
    --card: #ffffff;
    --ink: #2b2118;
    --muted: #8a7b6d;
    --accent: #ff6b35;
    --accent-dark: #e4521d;
    --gold: #ffc23d;
    --line: #f0e3d6;
    --neon: #2ef2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { margin: 0 0 6px; font-size: 28px; }
  header p { margin: 0; color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 4px 18px rgba(120, 70, 20, 0.06);
  }
  .card h2 { margin: 0 0 14px; font-size: 18px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; font-size: 15px; color: var(--muted); font-family: inherit;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  textarea, input[type="number"] {
    width: 100%; font-size: 16px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #fffdfb; color: var(--ink); font-family: inherit;
  }
  textarea { min-height: 140px; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid var(--gold); border-color: transparent; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row label { font-size: 14px; color: var(--muted); }
  .row .field { flex: 1; min-width: 120px; }
  .count { margin-top: 10px; font-size: 14px; }
  .count b { color: var(--accent); }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .btn {
    display: block; width: 100%; padding: 18px; border: none; border-radius: 14px;
    background: var(--accent); color: #fff; font-size: 20px; font-weight: 800; cursor: pointer;
    transition: transform .1s, background .2s; font-family: inherit;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #d9c9ba; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: var(--muted); border: 1px solid var(--line); font-size: 14px; padding: 10px; font-weight: 500; }
  .placeholder { text-align: center; color: var(--muted); padding: 10px 0 16px; }
  .winners { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
  .winner {
    background: var(--gold); color: var(--ink); border-radius: 14px; padding: 12px 18px;
    font-size: 26px; font-weight: 900; animation: pop .4s ease-out; font-variant-numeric: tabular-nums;
  }
  .winner small { display: block; font-size: 11px; font-weight: 600; opacity: .7; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  .history { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  .history li { padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .history li:last-child { border-bottom: none; }
  .history time { color: var(--muted); font-size: 12px; margin-right: 8px; }
  .error { color: #d43c2c; font-size: 14px; margin-top: 10px; min-height: 18px; }
  .hidden { display: none !important; }
  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }

  /* 서바이벌 미로 화면 */
  .race { position: fixed; inset: 0; background: #000; z-index: 20; }
  .race canvas { width: 100%; height: 100%; display: block; }
  .race-bar {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center;
    background: rgba(20, 20, 24, .8); border: 1px solid rgba(46, 242, 255, .4);
    border-radius: 999px; padding: 6px 8px 6px 16px; color: #fff; font-size: 14px; white-space: nowrap;
  }
  .race-bar button {
    background: transparent; color: var(--neon); border: 1px solid rgba(46, 242, 255, .5);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .race-bar button:hover { background: rgba(46, 242, 255, .15); }
  .race-result {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .55); padding: 20px;
  }
  .race-result .box {
    background: #fff; border-radius: 20px; padding: 26px 22px 22px; width: 100%; max-width: 420px; text-align: center;
    animation: pop .4s ease-out;
  }
  .race-result h3 { margin: 0 0 4px; font-size: 24px; }
  .race-result p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <header>
    <h1>🎁 리뷰 이벤트 서바이벌 추첨</h1>
    <p>번호가 적힌 공들이 미로를 내려가요. 구멍에 빠지면 탈락, 끝까지 살아남은 공이 당첨!</p>
  </header>

  <section class="card">
    <h2>1. 참여 번호 입력</h2>
    <div class="tabs" id="inputTabs">
      <button class="tab active" data-mode="list">번호 직접 입력</button>
      <button class="tab" data-mode="range">번호 범위로 입력</button>
    </div>

    <div id="mode-list">
      <textarea id="numbers" placeholder="예) 1234, 5678, 9012&#10;또는 한 줄에 하나씩 입력&#10;(전화번호 뒷자리, 영수증 번호 등)"></textarea>
      <div class="hint">쉼표, 띄어쓰기, 줄바꿈으로 구분해요. 엑셀에서 복사해 붙여넣어도 됩니다.</div>
      <label class="check"><input type="checkbox" id="dedupe" checked> 같은 번호는 한 번만 참여 (중복 제거)</label>
    </div>

    <div id="mode-range" class="hidden">
      <div class="row">
        <div class="field"><label>시작 번호</label><input type="number" id="rangeStart" value="1" min="0"></div>
        <div class="field"><label>끝 번호</label><input type="number" id="rangeEnd" value="30" min="0"></div>
      </div>
      <div class="hint">예) 쿠폰 1번 ~ 30번 중에서 추첨</div>
    </div>

    <div class="count">참여 인원: <b id="total">0</b>명</div>
  </section>

  <section class="card">
    <h2>2. 추첨 설정</h2>
    <div class="row">
      <div class="field"><label>당첨 인원 (끝까지 살아남을 공 개수)</label><input type="number" id="winnerCount" value="1" min="1"></div>
    </div>
    <label class="check"><input type="checkbox" id="excludePrev" checked> 이전에 당첨된 번호는 제외하기</label>
  </section>

  <section class="card">
    <div class="placeholder" id="resultLabel">시작 버튼을 누르면 서바이벌이 시작돼요</div>
    <div class="winners" id="winners"></div>
    <button class="btn" id="drawBtn">🔥 서바이벌 시작</button>
    <div class="error" id="error"></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
      <h2 style="margin: 0;">당첨 기록</h2>
      <button class="btn ghost" id="clearBtn" style="width: auto;">기록 지우기</button>
    </div>
    <ul class="history" id="history"><li style="color: var(--muted);">아직 추첨 기록이 없어요</li></ul>
  </section>
</div>

<div class="race hidden" id="race">
  <canvas id="raceCanvas"></canvas>
  <div class="race-bar">
    <span id="raceInfo"></span>
    <button id="speedBtn">속도 1x</button>
    <button id="stopBtn">✕ 중단</button>
  </div>
  <div class="race-result hidden" id="raceResult">
    <div class="box">
      <h3>🏆 최후의 생존자!</h3>
      <p id="raceResultInfo"></p>
      <div class="winners" id="raceWinners"></div>
      <button class="btn" id="raceOk">확인</button>
    </div>
  </div>
</div>

<script src="matter.min.js"></script>
<script>
  // 같은 폴더에 matter.min.js 가 없으면 인터넷(CDN)에서 불러오기
  window.Matter || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"><\/script>');
</script>
<script>
  const $ = (id) => document.getElementById(id);
  const STORE_KEY = 'luckyDraw.v1';
  let mode = 'list';
  let history = [];

  // 공정한 추첨을 위해 Math.random 대신 브라우저 암호학적 난수 사용
  function randomInt(max) {
    const buf = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / max) * max;
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return x % max;
  }
  const random = () => randomInt(1e9) / 1e9;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = randomInt(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function getEntries() {
    if (mode === 'range') {
      const s = parseInt($('rangeStart').value, 10);
      const e = parseInt($('rangeEnd').value, 10);
      if (isNaN(s) || isNaN(e) || e < s) return [];
      if (e - s > 100000) return [];
      return Array.from({ length: e - s + 1 }, (_, i) => String(s + i));
    }
    const list = $('numbers').value.split(/[\s,;]+/).map((v) => v.trim()).filter(Boolean);
    return $('dedupe').checked ? [...new Set(list)] : list;
  }

  function pastWinners() {
    return new Set(history.flatMap((h) => h.winners));
  }

  function updateCount() {
    $('total').textContent = getEntries().length.toLocaleString();
    save();
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        mode,
        numbers: $('numbers').value,
        rangeStart: $('rangeStart').value,
        rangeEnd: $('rangeEnd').value,
        winnerCount: $('winnerCount').value,
        dedupe: $('dedupe').checked,
        excludePrev: $('excludePrev').checked,
        history,
      }));
    } catch (_) {}
  }

  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE_KEY));
      if (!d) return;
      $('numbers').value = d.numbers ?? '';
      $('rangeStart').value = d.rangeStart ?? 1;
      $('rangeEnd').value = d.rangeEnd ?? 30;
      $('winnerCount').value = d.winnerCount ?? 1;
      $('dedupe').checked = d.dedupe ?? true;
      $('excludePrev').checked = d.excludePrev ?? true;
      history = d.history ?? [];
      setMode(d.mode ?? 'list');
    } catch (_) {}
  }

  function setMode(m) {
    mode = m;
    document.querySelectorAll('#inputTabs .tab').forEach((t) => t.classList.toggle('active', t.dataset.mode === m));
    $('mode-list').classList.toggle('hidden', m !== 'list');
    $('mode-range').classList.toggle('hidden', m !== 'range');
    updateCount();
  }

  function renderHistory() {
    const ul = $('history');
    if (!history.length) {
      ul.innerHTML = '<li style="color: var(--muted);">아직 추첨 기록이 없어요</li>';
      return;
    }
    ul.innerHTML = '';
    [...history].reverse().forEach((h) => {
      const li = document.createElement('li');
      const time = document.createElement('time');
      time.textContent = h.time;
      li.append(time, `${h.total}명 중 → 🏆 ${h.winners.join(', ')}`);
      ul.appendChild(li);
    });
  }

  function winnerChip(label, i) {
    const chip = document.createElement('div');
    chip.className = 'winner';
    chip.innerHTML = `<small>${i + 1}번째 당첨</small>`;
    chip.append(label);
    return chip;
  }

  async function draw() {
    $('error').textContent = '';
    let pool = getEntries();
    if ($('excludePrev').checked) {
      const prev = pastWinners();
      pool = pool.filter((n) => !prev.has(n));
    }
    const count = parseInt($('winnerCount').value, 10);

    if (!pool.length) { $('error').textContent = '추첨할 번호가 없어요. 번호를 입력해 주세요.'; return; }
    if (!count || count < 1) { $('error').textContent = '당첨 인원을 1명 이상으로 입력해 주세요.'; return; }
    if (count >= pool.length) { $('error').textContent = `당첨 인원은 참여 인원(${pool.length}명)보다 적어야 해요.`; return; }
    if (!window.Matter) { $('error').textContent = '미로를 불러오지 못했어요. matter.min.js 파일이 같은 폴더에 있는지, 인터넷이 연결되어 있는지 확인해 주세요.'; return; }
    if (pool.length > Race.MAX) { $('error').textContent = `한 번에 ${Race.MAX}명까지 참여할 수 있어요.`; return; }

    $('drawBtn').disabled = true;
    const winners = await Race.run(pool, count);
    $('drawBtn').disabled = false;
    if (!winners) return;

    $('resultLabel').textContent = `${pool.length}개 공 중 끝까지 살아남은 공`;
    $('winners').innerHTML = '';
    winners.forEach((w, i) => $('winners').appendChild(winnerChip(w, i)));
    history.push({ time: new Date().toLocaleString('ko-KR'), total: pool.length, winners });
    renderHistory();
    save();
  }

  // 간단한 꽃가루 효과
  function confetti() {
    const c = $('confetti');
    const ctx = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    const colors = ['#ff6b35', '#ffc23d', '#4ecdc4', '#ff4f81', '#7b61ff'];
    const parts = Array.from({ length: 160 }, () => ({
      x: c.width / 2, y: c.height / 3,
      vx: (Math.random() - 0.5) * 16, vy: Math.random() * -14 - 4,
      s: Math.random() * 6 + 4, color: colors[Math.floor(Math.random() * colors.length)], r: Math.random() * 6,
    }));
    let frame = 0;
    (function tick() {
      ctx.clearRect(0, 0, c.width, c.height);
      parts.forEach((p) => {
        p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += 0.1;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.color; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
        ctx.restore();
      });
      if (++frame < 100) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, c.width, c.height);
    })();
  }

  // ───────────────────────── 서바이벌 미로 ─────────────────────────
  // 공마다 크기·무게·탄성이 모두 같고, 출발 위치만 암호학적 난수로 섞어서 배치해요.
  // 그 뒤로는 물리 엔진이 굴리는 대로 결과가 나오기 때문에 누구도 결과를 조작할 수 없어요.
  // 맨 아래 구멍에 빠지면 탈락이고, 마지막까지 남은 공이 당첨이에요.
  const Race = (() => {
    const MAX = 300;
    const L = 40, R = 680, CX = 360;   // 미로 바깥 벽의 x 좌표
    const GATE_Y = 200;
    const STEP = 1000 / 120;
    const NEON = '#2ef2ff', PINK = '#ff3d9a', GOLD = '#ffc23d', RED = '#ff2d55';

    let M, engine, statics, movers, balls, alive, total, need, pitY, topY, gate;
    let canvas, ctx, dpr, cw, ch, cam, zoom, speed, started, countdownEnd, ended, stopped;
    let simTime, acc, particles, toasts, shake, resolveRun, raf;

    // ── 코스 부품 ──
    function add(b, kind) { b.kind = kind; statics.push(b); return b; }
    function seg(x1, y1, x2, y2, t = 14) {
      const len = Math.hypot(x2 - x1, y2 - y1);
      const b = M.Bodies.rectangle((x1 + x2) / 2, (y1 + y2) / 2, len + t, t, {
        isStatic: true, angle: Math.atan2(y2 - y1, x2 - x1), friction: 0.01, restitution: 0.3,
      });
      b.line = [x1, y1, x2, y2];
      return add(b, 'wall');
    }
    function path(pts) {
      for (let i = 1; i < pts.length; i++) seg(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
    }
    function peg(x, y) { add(M.Bodies.circle(x, y, 6, { isStatic: true, restitution: 0.6 }), 'peg'); }
    function slat(x, y, len, angle) { add(M.Bodies.rectangle(x, y, len, 8, { isStatic: true, angle, restitution: 0.4 }), 'poly'); }
    function diamond(x, y) { add(M.Bodies.polygon(x, y, 4, 18, { isStatic: true, restitution: 0.9, angle: Math.PI / 4 }), 'poly'); }
    function kicker(x, y) { add(M.Bodies.circle(x, y, 20, { isStatic: true, restitution: 1 }), 'kick'); }
    function spinner(x, y, len, spin) {
      const b = add(M.Bodies.rectangle(x, y, len, 14, { isStatic: true, restitution: 0.5, friction: 0.05 }), 'poly');
      b.move = () => M.Body.setAngle(b, b.angle + spin / 2, true);
      movers.push(b);
    }
    function slider(y, len, cx, amp, period, phase) {
      const b = add(M.Bodies.rectangle(cx, y, len, 14, { isStatic: true, restitution: 0.5 }), 'poly');
      b.move = (t) => M.Body.setPosition(b, { x: cx + amp * Math.sin((t / period) * Math.PI * 2 + phase), y }, true);
      movers.push(b);
    }
    function chevrons(y0, rows) {
      for (let r = 0; r < rows; r++) {
        const off = r % 2 ? 50 : 0;
        for (let x = L + 60 + off; x < R - 40; x += 100) slat(x, y0 + r * 95, 64, r % 2 ? 0.5 : -0.5);
      }
    }

    function buildCourse() {
      statics = [];
      movers = [];
      // 출발 대기실 + 출발 게이트
      seg(L, -4000, L, GATE_Y); seg(R, -4000, R, GATE_Y);
      gate = seg(L, GATE_Y, R, GATE_Y);
      gate.kind = 'gate';
      // ① 첫 번째 깔때기
      seg(L, GATE_Y, 240, 440); seg(R, GATE_Y, 480, 440);
      seg(240, 440, 240, 500); seg(480, 440, 480, 500);
      seg(240, 500, L, 680); seg(480, 500, R, 680);
      seg(L, 680, L, 5100); seg(R, 680, R, 5100);
      // ② 빗살 장애물
      chevrons(740, 4);
      // ③ 두 갈래 길 (왼쪽은 핀밭, 오른쪽은 지그재그)
      seg(300, 1240, 360, 1180); seg(360, 1180, 420, 1240);
      seg(300, 1240, 300, 1860); seg(420, 1240, 420, 1860);
      seg(300, 1860, 360, 1920); seg(420, 1860, 360, 1920);
      for (let r = 0, y = 1290; y < 1840; r++, y += 60) {
        for (let x = 72 + (r % 2 ? 28 : 0); x < 290; x += 56) peg(x, y);
      }
      seg(420, 1300, 620, 1360); seg(R, 1450, 480, 1510);
      seg(420, 1600, 620, 1660); seg(R, 1750, 480, 1810);
      // ④ 회전 막대 구간
      spinner(200, 2000, 220, 0.04); spinner(520, 2000, 220, -0.04);
      spinner(360, 2190, 240, 0.05); spinner(110, 2190, 120, -0.07); spinner(610, 2190, 120, 0.07);
      spinner(200, 2370, 220, -0.045); spinner(520, 2370, 220, 0.045);
      // ⑤ 지그재그 미로 통로
      seg(L, 2480, 280, 2560); seg(R, 2480, 440, 2560);
      path([[280, 2560], [480, 2760], [80, 3010], [480, 3260], [280, 3360]]);
      path([[440, 2560], [640, 2760], [240, 3010], [640, 3260], [440, 3360]]);
      seg(280, 3360, L, 3480); seg(440, 3360, R, 3480);
      // ⑥ 튕겨내는 범퍼 (핑볼)
      for (let r = 0; r < 4; r++) {
        const off = r % 2 ? 65 : 0;
        for (let x = L + 80 + off; x < R - 50; x += 130) kicker(x, 3560 + r * 120);
      }
      // ⑦ 좌우로 움직이는 막대
      slider(4080, 200, CX, 200, 2400, 0);
      slider(4230, 200, CX, 200, 2000, Math.PI);
      slider(4380, 200, CX, 200, 2800, Math.PI / 2);
      // ⑧ 빗살 + 다이아몬드
      chevrons(4480, 3);
      for (let r = 0; r < 2; r++) {
        for (let x = 120 + (r % 2 ? 60 : 0); x < R - 40; x += 120) diamond(x, 4800 + r * 100);
      }
      // ⑨ 마지막 깔때기 + 탈락 구멍
      seg(L, 5000, 300, 5260); seg(R, 5000, 420, 5260);
      spinner(CX, 5170, 150, 0.06);
      seg(300, 5260, 300, 5420); seg(420, 5260, 420, 5420);
      pitY = 5380;
    }

    function spawnBalls(entries) {
      const r = entries.length > 120 ? 7 : 9;
      const gap = 2 * r + 6;
      const perRow = Math.floor((R - L - 30) / gap);
      const order = shuffle(entries.map((label, i) => ({ label, i })));
      balls = order.map((e, k) => {
        const row = Math.floor(k / perRow);
        const col = k % perRow;
        const x = L + 20 + r + col * gap + random() * 4;
        const y = GATE_Y - 20 - r - row * gap;
        const b = M.Bodies.circle(x, y, r, { restitution: 0.4, friction: 0.01, frictionAir: 0.012, density: 0.002 });
        b.isBall = true;
        b.label = e.label;
        b.color = `hsl(${(e.i * 137.5) % 360}, 90%, 62%)`;
        b.r = r;
        b.trail = [];
        b.checkY = y;
        b.checkT = 0;
        return b;
      });
      topY = Math.min(...balls.map((b) => b.position.y)) - 60;
    }

    function resize() {
      dpr = window.devicePixelRatio || 1;
      cw = canvas.clientWidth;
      ch = canvas.clientHeight;
      canvas.width = cw * dpr;
      canvas.height = ch * dpr;
    }

    // ── 물리 진행 ──
    function onCollision(e) {
      for (const p of e.pairs) {
        let s = p.bodyA, b = p.bodyB;
        if (s.isBall) [s, b] = [b, s];
        if (!b.isBall || s.isBall) continue;
        s.flash = simTime;
        if (s.kind === 'kick') {
          const dx = b.position.x - s.position.x, dy = b.position.y - s.position.y;
          const d = Math.hypot(dx, dy) || 1;
          M.Body.setVelocity(b, { x: (dx / d) * 11, y: (dy / d) * 11 });
        }
      }
    }

    function step() {
      for (const m of movers) m.move(simTime);
      M.Engine.update(engine, STEP);
      simTime += STEP;
      for (const b of balls) {
        if (b.out || b.win) continue;
        // 너무 빨라서 벽을 뚫지 않도록 속도 제한
        const v = b.velocity, sp = Math.hypot(v.x, v.y);
        if (sp > 16) M.Body.setVelocity(b, { x: (v.x * 16) / sp, y: (v.y * 16) / sp });
        // 만약 코스 밖으로 튕겨 나가면 가운데로 되돌리기
        if (b.position.x < L - 30 || b.position.x > R + 30) {
          M.Body.setPosition(b, { x: CX, y: b.position.y });
          M.Body.setVelocity(b, { x: 0, y: 0 });
        }
        if (!started || ended) continue;
        if (b.position.y > pitY) {
          eliminate(b);
          continue;
        }
        // 어딘가에 끼어서 2초 넘게 못 내려가면 살짝 흔들어주기
        if (simTime - b.checkT > 2000) {
          if (b.position.y - b.checkY < 15) M.Body.setVelocity(b, { x: (random() - 0.5) * 8, y: -3 });
          b.checkY = b.position.y;
          b.checkT = simTime;
        }
      }
    }

    function eliminate(b) {
      b.out = true;
      alive--;
      M.Composite.remove(engine.world, b);
      for (let i = 0; i < 28; i++) {
        const a = random() * Math.PI * 2, s = 2 + random() * 6;
        particles.push({ x: b.position.x, y: b.position.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, life: 1, color: b.color });
      }
      shake = 14;
      toasts.push({ text: `💥 ${b.label} 탈락!`, color: b.color, t: performance.now() });
      if (alive === need) finish();
    }

    function finish() {
      ended = true;
      const winners = balls.filter((b) => !b.out);
      winners.forEach((b) => { b.win = true; M.Body.setStatic(b, true); });
      confetti();
      setTimeout(() => showResult(winners), 2600);
    }

    function showResult(winners) {
      if (stopped) return;
      $('raceResultInfo').textContent = `${total}개 공 중 끝까지 살아남은 ${winners.length}개`;
      const box = $('raceWinners');
      box.innerHTML = '';
      winners.forEach((b, i) => box.appendChild(winnerChip(b.label, i)));
      $('raceResult').classList.remove('hidden');
      $('raceOk').onclick = () => close(winners.map((b) => b.label));
    }

    function close(result) {
      stopped = true;
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      M.Engine.clear(engine);
      $('race').classList.add('hidden');
      $('raceResult').classList.add('hidden');
      document.body.style.overflow = '';
      resolveRun(result);
    }

    // 구멍에 가장 가까운(= 다음 탈락 위기) 공
    function leader() {
      let best = null;
      for (const b of balls) if (!b.out && (!best || b.position.y > best.position.y)) best = b;
      return best;
    }

    // 카메라가 볼 공: 구멍 근처에선 선두를, 아직 멀면 앞쪽 무리를 따라가요
    function focusBall(lead) {
      if (!lead || pitY - lead.position.y < 700) return lead;
      const list = balls.filter((b) => !b.out).sort((a, b) => b.position.y - a.position.y);
      return list[Math.floor(list.length * 0.15)];
    }

    // ── 그리기 ──
    function render(now, lead, focus, dramatic) {
      // 카메라: 탈락 위기의 공을 따라가고, 끝나면 생존자에게 확대
      let tx = CX, ty = GATE_Y - 120;
      if (ended) {
        const w = balls.filter((b) => b.win);
        tx = w.reduce((s, b) => s + b.position.x, 0) / w.length;
        ty = w.reduce((s, b) => s + b.position.y, 0) / w.length;
      } else if (started && focus) {
        tx = focus.position.x;
        ty = focus.position.y;
      }
      zoom += ((ended ? (need > 1 ? 1 : 1.6) : dramatic ? 1.3 : 1) - zoom) * 0.04;
      const scale = Math.min(ch / 450, cw / 360) * zoom;
      const viewW = cw / scale, viewH = ch / scale;
      cam.y += (ty - cam.y) * 0.08;
      if (viewW >= R - L + 80) cam.x = CX;
      else cam.x += (Math.max(L - 40 + viewW / 2, Math.min(R + 40 - viewW / 2, tx)) - cam.x) * 0.08;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, cw, ch);

      ctx.save();
      ctx.translate(cw / 2 + (Math.random() - 0.5) * shake, ch / 2 + (Math.random() - 0.5) * shake);
      shake *= 0.9;
      ctx.scale(scale, scale);
      ctx.translate(-cam.x, -cam.y);
      const y0 = cam.y - viewH / 2 - 100, y1 = cam.y + viewH / 2 + 100;
      const visible = (b) => b.bounds.max.y > y0 && b.bounds.min.y < y1;

      // 탈락 구멍
      if (pitY > y0 && pitY < y1 + 200) {
        const pulse = 0.6 + 0.4 * Math.sin(now / 200);
        const g = ctx.createLinearGradient(0, pitY - 40, 0, pitY + 40);
        g.addColorStop(0, 'rgba(255,45,85,0)');
        g.addColorStop(1, `rgba(255,45,85,${0.7 * pulse})`);
        ctx.fillStyle = g;
        ctx.fillRect(300, pitY - 40, 120, 80);
        ctx.fillStyle = RED;
        ctx.shadowColor = RED;
        ctx.shadowBlur = 20;
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💀 탈락', CX, pitY + 70);
        ctx.shadowBlur = 0;
      }

      // 벽 (흰색 네온)
      ctx.lineCap = 'round';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 5;
      ctx.beginPath();
      for (const b of statics) {
        if (b.kind !== 'wall' || !visible(b)) continue;
        const [x1, yA, x2, yB] = b.line;
        ctx.moveTo(x1, yA);
        ctx.lineTo(x2, yB);
      }
      ctx.stroke();

      // 출발 게이트
      if (!started) {
        ctx.setLineDash([12, 10]);
        ctx.strokeStyle = GOLD;
        ctx.shadowColor = GOLD;
        ctx.beginPath();
        ctx.moveTo(L, GATE_Y);
        ctx.lineTo(R, GATE_Y);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 장애물 (부딪히면 하얗게 번쩍)
      for (const b of statics) {
        if (!visible(b) || b.kind === 'wall' || b.kind === 'gate') continue;
        const hit = b.flash !== undefined && simTime - b.flash < 160;
        const color = hit ? '#fff' : b.kind === 'kick' ? PINK : NEON;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = hit ? 25 : 10;
        ctx.beginPath();
        if (b.kind === 'peg') {
          ctx.arc(b.position.x, b.position.y, 6, 0, Math.PI * 2);
          ctx.fill();
        } else if (b.kind === 'kick') {
          ctx.arc(b.position.x, b.position.y, hit ? 23 : 20, 0, Math.PI * 2);
          ctx.lineWidth = 5;
          ctx.strokeStyle = color;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(b.position.x, b.position.y, 8, 0, Math.PI * 2);
          ctx.fill();
        } else {
          b.vertices.forEach((v, i) => (i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y)));
          ctx.closePath();
          ctx.fill();
        }
      }
      ctx.shadowBlur = 0;

      // 공 꼬리
      ctx.lineCap = 'round';
      for (const b of balls) {
        if (b.out || b.trail.length < 2 || b.position.y < y0 || b.position.y > y1) continue;
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = b.color;
        ctx.lineWidth = b.r * 1.2;
        ctx.beginPath();
        b.trail.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // 공 + 번호
      ctx.textAlign = 'left';
      for (const b of balls) {
        if (b.out || b.position.y < y0 || b.position.y > y1) continue;
        if (b.win) {
          const pr = b.r + 8 + 4 * Math.sin(now / 150);
          ctx.strokeStyle = GOLD;
          ctx.shadowColor = GOLD;
          ctx.shadowBlur = 20;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(b.position.x, b.position.y, pr, 0, Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.position.x, b.position.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        if (b === lead && !ended) {
          ctx.strokeStyle = RED;
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }
        const fs = b.win ? b.r + 10 : b.r + 4;
        ctx.font = `bold ${fs}px sans-serif`;
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000';
        ctx.strokeText(b.label, b.position.x + b.r - 2, b.position.y + b.r + fs - 2);
        ctx.fillText(b.label, b.position.x + b.r - 2, b.position.y + b.r + fs - 2);
      }

      // 탈락 파편
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      drawMinimap(viewH);
      drawSurvivors(lead);
      drawHud(now, dramatic);
    }

    function drawMinimap(viewH) {
      const narrow = cw < 600;
      const h = narrow ? ch * 0.4 : ch - 24;
      const s = h / (pitY + 60 - topY);
      const w = (R - L + 40) * s;
      const ox = 12 - (L - 20) * s, oy = 12 - topY * s;
      ctx.fillStyle = 'rgba(30, 30, 34, .75)';
      ctx.strokeStyle = 'rgba(80, 200, 120, .6)';
      ctx.lineWidth = 1;
      ctx.fillRect(12, 12, w, h);
      ctx.strokeRect(12, 12, w, h);
      ctx.strokeStyle = 'rgba(255, 255, 255, .7)';
      ctx.beginPath();
      for (const b of statics) {
        if (b.kind !== 'wall') continue;
        const [x1, yA, x2, yB] = b.line;
        ctx.moveTo(ox + x1 * s, oy + Math.max(yA, topY) * s);
        ctx.lineTo(ox + x2 * s, oy + Math.max(yB, topY) * s);
      }
      ctx.stroke();
      for (const b of statics) {
        if (b.kind === 'wall' || b.kind === 'gate') continue;
        ctx.fillStyle = b.kind === 'kick' ? PINK : NEON;
        ctx.fillRect(ox + b.position.x * s - 1, oy + b.position.y * s - 1, 2, 2);
      }
      ctx.fillStyle = RED;
      ctx.fillRect(ox + 300 * s, oy + pitY * s - 2, 120 * s, 4);
      for (const b of balls) {
        if (b.out) continue;
        ctx.fillStyle = b.color;
        ctx.fillRect(ox + b.position.x * s - 1.5, oy + b.position.y * s - 1.5, 3, 3);
      }
      ctx.strokeStyle = GOLD;
      ctx.strokeRect(12, oy + (cam.y - viewH / 2) * s, w, viewH * s);
    }

    // 오른쪽 목록: 살아있는 공을 "탈락 위기 순"으로
    function drawSurvivors(lead) {
      const narrow = cw < 600;
      const lineH = narrow ? 15 : 18;
      const list = balls.filter((b) => !b.out).sort((a, b) => b.position.y - a.position.y);
      const maxLines = Math.max(3, Math.floor((narrow ? ch * 0.4 : ch - 160) / lineH) - 1);
      const lines = list.slice(0, list.length > maxLines ? maxLines - 1 : maxLines).map((b) => ({
        text: `${b.win ? '🏆 ' : b === lead ? '⚠️ ' : ''}${b.label}`, color: b.color, win: b.win,
      }));
      if (list.length > maxLines) lines.push({ text: `… 외 ${list.length - maxLines + 1}개`, color: '#aaa' });
      ctx.font = `bold ${narrow ? 12 : 14}px sans-serif`;
      const head = ended ? '최후의 생존자' : '탈락 위기 순';
      const w = Math.max(ctx.measureText(head).width, ...lines.map((l) => ctx.measureText(l.text).width)) + 20;
      const x = cw - w - 12, top = narrow ? 84 : 12;
      ctx.fillStyle = 'rgba(30, 30, 34, .75)';
      ctx.fillRect(x, top, w, lineH * (lines.length + 1) + 12);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#aaa';
      ctx.fillText(head, cw - 22, top + lineH);
      lines.forEach((l, i) => {
        const y = top + lineH * (i + 2);
        if (l.win) {
          ctx.fillStyle = 'rgba(255, 194, 61, .3)';
          ctx.fillRect(x + 4, y - lineH + 4, w - 8, lineH);
        }
        ctx.fillStyle = l.color;
        ctx.fillText(l.text, cw - 22, y);
      });
    }

    // 가운데 위: 생존 수, 탈락 알림, 긴장감 문구
    function drawHud(now, dramatic) {
      ctx.textAlign = 'center';
      const narrow = cw < 600;
      const cx = cw / 2;
      ctx.fillStyle = 'rgba(20, 20, 24, .8)';
      const bw = narrow ? 150 : 220, bh = narrow ? 58 : 72;
      ctx.fillRect(cx - bw / 2, 12, bw, bh);
      ctx.strokeStyle = ended ? GOLD : 'rgba(46, 242, 255, .5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(cx - bw / 2, 12, bw, bh);
      ctx.fillStyle = '#fff';
      ctx.font = `900 ${narrow ? 26 : 34}px sans-serif`;
      ctx.fillText(`생존 ${alive}`, cx, 12 + (narrow ? 32 : 42));
      ctx.font = `bold ${narrow ? 11 : 13}px sans-serif`;
      ctx.fillStyle = '#aaa';
      ctx.fillText(`${total}개 중 · ${need}개 남으면 끝!`, cx, 12 + bh - 10);

      // 탈락 알림
      const t = performance.now();
      toasts = toasts.filter((x) => t - x.t < 2200).slice(-4);
      ctx.font = `bold ${narrow ? 14 : 18}px sans-serif`;
      toasts.forEach((x, i) => {
        ctx.globalAlpha = Math.min(1, (2200 - (t - x.t)) / 500);
        ctx.fillStyle = x.color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        const y = 12 + bh + 26 + i * (narrow ? 20 : 26);
        ctx.strokeText(x.text, cx, y);
        ctx.fillText(x.text, cx, y);
      });
      ctx.globalAlpha = 1;

      const banner = (text, color) => {
        ctx.font = `900 ${narrow ? 24 : 40}px sans-serif`;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 25;
        ctx.globalAlpha = 0.75 + 0.25 * Math.sin(now / 120);
        ctx.fillText(text, cx, ch * 0.72);
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      };
      if (dramatic) banner('🔥 마지막 탈락자는 누구?!', RED);
      if (ended) banner('🏆 최후의 생존자!', GOLD);

      // 출발 카운트다운
      if (!started) {
        const n = Math.ceil((countdownEnd - now) / 1000);
        ctx.fillStyle = GOLD;
        ctx.font = `900 ${Math.min(cw, ch) * 0.25}px sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.shadowColor = GOLD;
        ctx.shadowBlur = 30;
        ctx.fillText(n > 0 ? n : 'GO!', cx, ch / 2);
        ctx.shadowBlur = 0;
        ctx.textBaseline = 'alphabetic';
      }
    }

    function frame(now) {
      if (stopped) return;
      if (!started && now >= countdownEnd) {
        started = true;
        M.Composite.remove(engine.world, gate);
        for (const b of balls) b.checkT = simTime;
      }
      let lead = leader();
      const dramatic = started && !ended && alive === need + 1;
      let rate = started ? speed : 1;
      // 마지막 한 명이 탈락하기 직전엔 슬로모션
      if (dramatic && lead && pitY - lead.position.y < 320) rate = Math.min(rate, 0.35);
      acc += 2 * rate;
      while (acc >= 1) { step(); acc -= 1; }
      lead = leader();

      for (const b of balls) {
        if (b.out) continue;
        b.trail.push({ x: b.position.x, y: b.position.y });
        if (b.trail.length > 7) b.trail.shift();
      }
      for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 0.025; }
      particles = particles.filter((p) => p.life > 0);

      render(now, lead, focusBall(lead), dramatic);
      raf = requestAnimationFrame(frame);
    }

    function run(entries, count) {
      M = window.Matter;
      need = count;
      total = entries.length;
      alive = total;
      started = false;
      ended = false;
      stopped = false;
      speed = 1;
      simTime = 0;
      acc = 0;
      zoom = 1;
      shake = 0;
      particles = [];
      toasts = [];
      buildCourse();
      spawnBalls(entries);
      engine = M.Engine.create({ positionIterations: 8, velocityIterations: 6 });
      M.Composite.add(engine.world, [...statics, ...balls]);
      M.Events.on(engine, 'collisionStart', onCollision);

      canvas = $('raceCanvas');
      ctx = canvas.getContext('2d');
      $('race').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      resize();
      window.addEventListener('resize', resize);
      cam = { x: CX, y: GATE_Y - 120 };
      countdownEnd = performance.now() + 3000;
      $('raceInfo').textContent = `끝까지 살아남은 ${count}명 당첨`;
      $('speedBtn').textContent = '속도 1x';
      $('speedBtn').onclick = () => {
        speed = speed >= 4 ? 1 : speed * 2;
        $('speedBtn').textContent = `속도 ${speed}x`;
      };
      $('stopBtn').onclick = () => close(null);
      raf = requestAnimationFrame(frame);
      return new Promise((resolve) => { resolveRun = resolve; });
    }

    return { run, MAX };
  })();

  document.querySelectorAll('#inputTabs .tab').forEach((t) => t.addEventListener('click', () => setMode(t.dataset.mode)));
  ['numbers', 'rangeStart', 'rangeEnd', 'winnerCount'].forEach((id) => $(id).addEventListener('input', updateCount));
  ['dedupe', 'excludePrev'].forEach((id) => $(id).addEventListener('change', updateCount));
  $('drawBtn').addEventListener('click', draw);

  // 실수 방지: 한 번 누르면 확인 문구로 바뀌고, 다시 눌러야 지워짐
  let clearArmed = false;
  $('clearBtn').addEventListener('click', () => {
    if (!clearArmed) {
      clearArmed = true;
      $('clearBtn').textContent = '정말 지울까요? 한 번 더 클릭';
      setTimeout(() => { clearArmed = false; $('clearBtn').textContent = '기록 지우기'; }, 3000);
      return;
    }
    clearArmed = false;
    $('clearBtn').textContent = '기록 지우기';
    history = [];
    renderHistory();
    save();
  });

  load();
  updateCount();
  renderHistory();
</script>
</body>
</html>
